name = "rout-backend"
main = "worker.js"
compatibility_date = "2026-10-01"

[[kv_namespaces]]
binding = "ROUT_KV"
id = "9526f452b61b4756974e0ab6cc1a93d6"
preview_id = "rout-preview-kv"

[vars]
GEMINI_MODEL = "gemini-3.6-flash"
TTS_MODEL = "gemini-3.8-flash-tts"
TTS_VOICE = "Achernar"
RATE_LIMIT_PER_MINUTE = "30"
# Secrets (GEMINI_API_KEY) are set via `wrangler secret put` - never in this file.

# OWNER_CODE is a Worker secret (wrangler secret put OWNER_CODE); value lives in the vault, never in this file.

[[durable_objects.bindings]]
name = "ENROLLMENT"
class_name = "EnrollmentStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EnrollmentStore"]
